name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Code Quality (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check app/ tests/ streamlit_app/

      - name: Run linter
        run: uv run ruff check app/ tests/ streamlit_app/

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit/

  test-frontend:
    name: Frontend Typecheck & E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Boot the FastAPI backend in the background for E2E user‐seeding.
      # All env vars here are throwaway CI values — nothing sensitive.
      - name: Start backend
        working-directory: ./
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv sync --all-extras
          $HOME/.local/bin/uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          POSTGRES_URL: "sqlite+aiosqlite:///./ci_test.db"
          ENABLE_AUTHENTICATION: "true"
          AUTH_SECRET: "ci-only-throwaway-secret-key-not-real"
          ENVIRONMENT: "test"

      # Boot the Next.js dev server in the background.
      # These env vars are CI‑only dummies — no NEXT_PUBLIC_ prefix, so
      # nothing is ever bundled into the client JS.
      - name: Start frontend
        run: pnpm dev &
        env:
          POSTGRES_URL: "sqlite+aiosqlite:///./ci_test.db"
          AUTH_SECRET: "ci-only-throwaway-secret-key-not-real"
          BACKEND_URL: "http://localhost:8000"
          BASE_URL: "http://localhost:3000"

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: pnpm e2e-test
        env:
          BACKEND_URL: "http://localhost:8000"
          BASE_URL: "http://localhost:3000"
          E2E_USER_A_EMAIL: "ci-testA@example.com"
          E2E_USER_A_PASSWORD: "CiTestPass1!"
          E2E_USER_B_EMAIL: "ci-testB@example.com"
          E2E_USER_B_PASSWORD: "CiTestPass2!"
