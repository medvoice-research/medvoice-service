name: Build Status
on:
  workflow_call:
    secrets: # Declare secrets expected from the caller
      HF_TOKEN:
        required: true
  push:
    branches-ignore:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "streamlit_app/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "docker-compose.gpu.yaml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches-ignore:
      - main
      - dev
    paths:
      - "app/**"
      - "tests/**"
      - "streamlit_app/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "docker-compose.gpu.yaml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WHISPER_MODEL: tiny
      DEFAULT_LANG: en
      DEVICE: cpu
      COMPUTE_TYPE: int8
    steps:
      - uses: actions/checkout@v4
      - run: echo "event name is:" ${{ github.event_name }}
      - run: echo "event type is:" ${{ github.event.action }}
      - run: echo "actor is:" ${{ github.actor }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: "0.6.6"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --group dev
      - name: Run Ruff linter
        run: uv run ruff check app/ tests/ streamlit_app/ --config pyproject.toml
      # tests/integration/ needs a live Temporal server, LM Studio and the
      # Kaggle audio dataset, none of which exist on a CI runner.
      - name: Run unit tests with coverage
        run: uv run pytest tests/unit/ --cov=app --cov-report=term-missing --cov-report=xml
