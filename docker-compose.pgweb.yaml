# pgweb - Minimal PostgreSQL Web Dashboard
# Standalone compose file; requires the main stack to be running first.
#
# Usage:
#   docker compose up -d                                  # start main stack
#   docker compose -f docker-compose.pgweb.yaml up -d     # start pgweb
#
# Access: http://localhost:${PGWEB_PORT:-8081}

services:
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pgweb
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    environment:
      DATABASE_URL: postgres://postgres:postgres@app-postgres:5432/postgres?sslmode=disable
    networks:
      - whisperx-network
    restart: unless-stopped

networks:
  whisperx-network:
    external: true
